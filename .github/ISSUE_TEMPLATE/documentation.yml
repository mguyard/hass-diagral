---
name: "Documentation"
description: "Report a typo, missing or incorrect documentation"
title: "[Documentation]:  "
labels: [documentation]
assignees: mguyard
body:
  - type: markdown
    attributes:
      value: |
        > [!NOTE]
        >
        > This issue form is for reporting documentation content improvement only!
        >
        > Before you open a new issue, search through the [existing issues][ei] to see if others have had the same problem.
        >
        > [ei]: https://github.com/mguyard/hass-diagral/issues?q=label%3Adocumentation


  - type: input
    validations:
      required: true
    attributes:
      label: What is the link of the concerned documentation?
      placeholder: https://
      description: >
        Please point the specific documentation page.

  - type: textarea
    validations:
      required: true
    attributes:
      label: What needs to be improved?
      description: >-
        Describe what needs to be improved in the documentation.
        Provide a clear and concise description of what the problem is.
        Upload screenshots (with annotations) to better locate the issue (if applicable).

  - type: textarea
    attributes:
      label: Diagnostics information
      placeholder: "drag-and-drop the diagnostics data file here (do not copy-and-paste the content)"
      description: >-
        It helps when the documentation does not match what your installation shows.
        Download it from the device page of your Diagral central, with "Download diagnostics".
        [What it contains](https://docs.page/mguyard/hass-diagral/issues#diagnostic-file): the state of the integration and the shape of what Diagral sends, without your credentials, serial or names.
        Please check it before sharing.

        If the integration could not be set up, there is no device to download it from: write N/A.
    validations:
      required: true
