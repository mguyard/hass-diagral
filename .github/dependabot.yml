version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Paris
    groups:
      # One PR a month for every action, instead of one per action
      github-actions:
        patterns:
          - "*"
    ignore:
      # Workflows use the v4 tag; CodeQL's frequent releases would otherwise
      # open a PR to pin each exact version
      - dependency-name: github/codeql-action
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    commit-message:
      # Trailing space: Dependabot adds no colon, so the gitmoji fits
      prefix: "chore(deps): 🔧 "
