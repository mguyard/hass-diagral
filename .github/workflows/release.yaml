---
name: Generate Semantic Release

on:
  push:
    branches:
      - main
      - beta

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment:
      name: Semver #your environment name
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/release/package-lock.json
      # Pinned in .github/release so Dependabot proposes each upgrade; release.config.cjs
      # relies on the changelog writer's API
      - name: Install semantic-release
        run: npm ci --prefix .github/release
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: .github/release/node_modules/.bin/semantic-release